<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MAEGANCYY — Trading Journal</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c98a3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAEGANCYY">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfaf8;
    --card:#ffffff;
    --line:#e9e6e0;
    --line-soft:#f0eee8;
    --ink:#2e2c28;
    --ink-dim:#8a8579;
    --ink-faint:#b5b0a3;
    --accent:#c98a3e;
    --accent-dim:#f2e2ca;

    --green-bg:#e3f1e6; --green-tx:#3c7a4c;
    --yellow-bg:#faf1d7; --yellow-tx:#a3801f;
    --purple-bg:#ede4f7; --purple-tx:#7749a8;
    --blue-bg:#e1eef8; --blue-tx:#33689e;
    --peach-bg:#fbe8dd; --peach-tx:#b06636;
    --orange-bg:#fde3d6; --orange-tx:#c05a26;
    --red-bg:#fbe2e1; --red-tx:#b8433d;
    --gray-bg:#eeece8; --gray-tx:#6b675c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  .wrap{max-width:920px;margin:0 auto;padding:26px 16px;}

  /* Header / brand */
  .brandbar{display:flex;align-items:center;gap:14px;margin-bottom:24px;}
  .avatar{
    width:46px;height:46px;border-radius:50%;
    background:linear-gradient(135deg,#c98a3e,#9a5a2c);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:'Outfit',sans-serif;font-weight:700;font-size:18px;
    flex-shrink:0;
  }
  .brand-name{
    font-family:'Outfit',sans-serif;
    font-weight:800;
    font-size:24px;
    letter-spacing:-0.01em;
    line-height:1.1;
  }
  .brand-sub{
    font-size:12px;
    color:var(--ink-dim);
    letter-spacing:0.03em;
    text-transform:uppercase;
    margin-top:2px;
  }

  /* Dashboard stat cards */
  .dash{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-bottom:22px;
  }
  @media (max-width:700px){.dash{grid-template-columns:repeat(2,1fr);}}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 14px;
  }
  .card .v{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;}
  .card .l{font-size:10.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.06em;margin-top:4px;}

  /* Equity curve card */
  .curve-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px 10px 18px;
    margin-bottom:22px;
  }
  .curve-title{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}

  /* Tool buttons */
  .tool-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .tool-btn{
    padding:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
  }
  .tool-btn:hover{border-color:var(--accent);}

  .tools-panel{
    display:none;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
    margin-bottom:22px;
  }
  .tools-panel.open{display:block;}
  .tool-tabs{display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid var(--line-soft);padding-bottom:12px;}
  .tool-tab{
    padding:8px 14px;
    background:none;
    border:1px solid var(--line);
    border-radius:20px;
    color:var(--ink-dim);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }
  .tool-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .tool-result{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin:14px 0 12px 0;
  }
  .tr-item{
    background:var(--bg);
    border:1px solid var(--line-soft);
    border-radius:10px;
    padding:12px;
    text-align:center;
  }
  .tr-v{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;color:var(--accent);}
  .tr-l{font-size:10px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.05em;margin-top:4px;}
  .risk-presets{display:flex;gap:8px;margin-bottom:6px;}
  .preset-chip{
    padding:6px 14px;
    background:var(--accent-dim);
    border:1px solid transparent;
    border-radius:20px;
    color:var(--accent);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }
  .tool-note{font-size:11.5px;color:var(--ink-faint);margin-top:8px;line-height:1.5;}

  /* Filters */
  .filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .filter-chip{
    font-size:12.5px;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--ink-dim);
    padding:6px 13px;
    border-radius:20px;
    cursor:pointer;
    font-weight:500;
  }
  .filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* New entry button */
  .new-btn{
    width:100%;
    padding:14px;
    background:var(--ink);
    border:none;
    border-radius:12px;
    color:#fff;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    margin-bottom:22px;
  }
  .new-btn:hover{opacity:0.9;}

  /* Form */
  form{
    display:none;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:26px;
  }
  form.open{display:block;}
  .form-title{font-family:'Outfit',sans-serif;font-weight:700;font-size:17px;margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:640px){.grid{grid-template-columns:1fr;}}
  .field{margin-bottom:12px;}
  .field label{
    display:flex;align-items:center;gap:5px;
    font-size:11.5px;
    color:var(--ink-dim);
    font-weight:600;
    margin-bottom:6px;
  }
  input,select,textarea{
    width:100%;
    background:#fdfcfa;
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--ink);
    padding:9px 11px;
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  textarea{resize:vertical;min-height:58px;}
  .other-input{margin-top:6px;display:none;}
  .other-input.show{display:block;}
  .checks{display:flex;gap:20px;margin:6px 0 16px 0;flex-wrap:wrap;}
  .check-item{display:flex;align-items:center;gap:7px;}
  .check-item input{width:auto;}
  .check-item label{margin:0;font-size:13px;color:var(--ink);font-weight:500;}
  .form-actions{display:flex;gap:10px;margin-top:6px;}
  .btn-primary{
    flex:1;padding:12px;background:var(--accent);border:none;border-radius:8px;
    color:#fff;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .btn-secondary{
    padding:12px 16px;background:none;border:1px solid var(--line);border-radius:8px;
    color:var(--ink-dim);cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;
  }

  /* Ledger title */
  .ledger-title{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.06em;margin:0 0 10px 4px;font-weight:600;}

  /* Trade cards */
  .trade{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:12px;
  }
  .trade-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .trade-instrument{font-family:'Outfit',sans-serif;font-weight:700;font-size:16.5px;}
  .trade-date{font-size:11.5px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .trade-result{text-align:right;}
  .result-pct{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:700;}
  .result-pct.pos{color:#3c7a4c;}
  .result-pct.neg{color:#b8433d;}
  .result-pct.flat{color:#8a8579;}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .pill{
    font-size:11.5px;
    padding:4px 10px;
    border-radius:6px;
    font-weight:600;
    white-space:nowrap;
  }
  .pill.green{background:var(--green-bg);color:var(--green-tx);}
  .pill.yellow{background:var(--yellow-bg);color:var(--yellow-tx);}
  .pill.purple{background:var(--purple-bg);color:var(--purple-tx);}
  .pill.blue{background:var(--blue-bg);color:var(--blue-tx);}
  .pill.peach{background:var(--peach-bg);color:var(--peach-tx);}
  .pill.orange{background:var(--orange-bg);color:var(--orange-tx);}
  .pill.red{background:var(--red-bg);color:var(--red-tx);}
  .pill.gray{background:var(--gray-bg);color:var(--gray-tx);}
  .trade-notes{font-size:13px;color:var(--ink-dim);font-style:italic;margin-top:6px;line-height:1.4;}
  .trade-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .flags{display:flex;gap:6px;}
  .flag-warn{font-size:10.5px;color:var(--red-tx);background:var(--red-bg);padding:3px 8px;border-radius:6px;font-weight:600;}
  .del-btn{background:none;border:none;color:var(--ink-faint);font-size:11.5px;cursor:pointer;}
  .del-btn:hover{color:#b8433d;}

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-dim);
    border:1px dashed var(--line);
    border-radius:12px;
  }
  .empty .big{font-family:'Outfit',sans-serif;font-weight:700;font-size:18px;color:var(--ink);margin-bottom:6px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="brandbar">
    <div class="avatar">M</div>
    <div>
      <div class="brand-name">MAEGANCYY</div>
      <div class="brand-sub">Trading Journal</div>
    </div>
  </div>

  <div class="dash" id="statsBar"></div>

  <div class="curve-card">
    <div class="curve-title">Account growth (% per trade, cumulative)</div>
    <svg id="curveSvg" width="100%" height="70" viewBox="0 0 880 70" preserveAspectRatio="none"></svg>
  </div>

  <div class="tool-row">
    <button class="tool-btn" id="toggleTools" data-tool="pips">📐 Pips Calculator</button>
    <button class="tool-btn" id="toggleTools2" data-tool="risk">🧮 Risk Calculator</button>
  </div>

  <div class="tools-panel" id="toolsPanel">
    <div class="tool-tabs">
      <button class="tool-tab active" data-tab="pips">Pips Calculator</button>
      <button class="tool-tab" data-tab="risk">Risk Calculator</button>
    </div>

    <div class="tool-body" id="pipsTool">
      <div class="grid">
        <div class="field">
          <label>⊙ Instrument</label>
          <select id="p-instrument"></select>
        </div>
        <div class="field">
          <label># Pip / Point Size</label>
          <input type="number" step="any" id="p-pipsize" value="0.0001">
        </div>
        <div class="field">
          <label>Price 1 (e.g. Entry)</label>
          <input type="number" step="any" id="p-price1" placeholder="1.09500">
        </div>
        <div class="field">
          <label>Price 2 (e.g. Stop Loss)</label>
          <input type="number" step="any" id="p-price2" placeholder="1.09300">
        </div>
      </div>
      <div class="tool-result">
        <div class="tr-item"><div class="tr-v" id="p-distance">0</div><div class="tr-l">Price Distance</div></div>
        <div class="tr-item"><div class="tr-v" id="p-pips">0</div><div class="tr-l">Pips / Points</div></div>
      </div>
      <button type="button" class="btn-secondary" id="sendToRisk">Use this in Risk Calculator →</button>
    </div>

    <div class="tool-body" id="riskTool" style="display:none;">
      <div class="grid">
        <div class="field">
          <label>⊙ Instrument</label>
          <select id="r-instrument"></select>
        </div>
        <div class="field">
          <label># Account Balance ($)</label>
          <input type="number" step="any" id="r-balance" placeholder="1000">
        </div>
        <div class="field">
          <label># Risk %</label>
          <input type="number" step="any" id="r-riskpct" placeholder="1">
        </div>
        <div class="field">
          <label># Stop Loss (pips / points)</label>
          <input type="number" step="any" id="r-slpips" placeholder="20">
        </div>
        <div class="field">
          <label># Pip / Point Value per 1.00 Lot ($)</label>
          <input type="number" step="any" id="r-pipvalue" placeholder="10">
        </div>
      </div>
      <div class="risk-presets">
        <button type="button" class="preset-chip" data-pct="0.5">0.5%</button>
        <button type="button" class="preset-chip" data-pct="1">1%</button>
        <button type="button" class="preset-chip" data-pct="2">2%</button>
      </div>
      <div class="tool-result">
        <div class="tr-item"><div class="tr-v" id="r-riskamt">$0</div><div class="tr-l">Risk Amount</div></div>
        <div class="tr-item"><div class="tr-v" id="r-lots">0.00</div><div class="tr-l">Standard Lots</div></div>
        <div class="tr-item"><div class="tr-v" id="r-minilots">0.00</div><div class="tr-l">Mini Lots</div></div>
        <div class="tr-item"><div class="tr-v" id="r-microlots">0.00</div><div class="tr-l">Micro Lots</div></div>
      </div>
      <div class="tool-note">Pip/point values vary by broker and instrument — check your contract specs and adjust the value above if needed.</div>
    </div>
  </div>

  <div class="filters" id="filterBar"></div>

  <button class="new-btn" id="toggleForm">+ New Trade</button>

  <form id="entryForm">
    <div class="form-title">Log a trade</div>
    <div class="grid">

      <div class="field">
        <label>⊙ Account Type</label>
        <select id="f-account">
          <option>Personal</option>
          <option>Goat Funded</option>
          <option>FTMO</option>
          <option>Other</option>
        </select>
        <input type="text" id="f-account-other" class="other-input" placeholder="Enter account type">
      </div>

      <div class="field">
        <label>⊙ Challenge Phase</label>
        <select id="f-phase">
          <option>Personal</option>
          <option>Phase 1</option>
          <option>Phase 2</option>
          <option>Funded</option>
        </select>
      </div>

      <div class="field">
        <label>⊙ Instrument</label>
        <select id="f-instrument">
          <option>Gold</option>
          <option>GBPUSD</option>
          <option>EURUSD</option>
          <option>NAS100 (Nasdaq)</option>
          <option>US30</option>
          <option>BTC</option>
          <option>ETH</option>
          <option>Other</option>
        </select>
        <input type="text" id="f-instrument-other" class="other-input" placeholder="Enter instrument">
      </div>

      <div class="field">
        <label>⊙ Bias</label>
        <select id="f-bias">
          <option>Bullish</option>
          <option>Bearish</option>
        </select>
      </div>

      <div class="field">
        <label>📅 Date</label>
        <input type="date" id="f-date" required>
      </div>

      <div class="field">
        <label>✓ HTF Confirmation</label>
        <input type="text" id="f-htf" placeholder="e.g. 15 IRL || ERL">
      </div>

      <div class="field">
        <label>⊙ Entry Model</label>
        <input type="text" id="f-model" placeholder="e.g. 9:30 model, OB + CHoCH">
      </div>

      <div class="field">
        <label>⊙ Rules</label>
        <select id="f-rules">
          <option>Not Break</option>
          <option>Broke Rules</option>
        </select>
      </div>

      <div class="field">
        <label># Risk</label>
        <input type="number" step="any" id="f-risk" placeholder="1">
      </div>

      <div class="field">
        <label>⇗ RR</label>
        <input type="number" step="any" id="f-rr" placeholder="3">
      </div>

      <div class="field">
        <label>⊙ Session</label>
        <select id="f-session">
          <option>London</option>
          <option>New York</option>
          <option>London/NY Overlap</option>
          <option>Asian</option>
        </select>
      </div>

      <div class="field">
        <label>⇘ Result</label>
        <select id="f-result">
          <option>TP</option>
          <option>SL</option>
          <option>BE</option>
        </select>
      </div>

      <div class="field">
        <label># Result %</label>
        <input type="number" step="any" id="f-resultpct" placeholder="e.g. 4 or -1">
      </div>

      <div class="field">
        <label>🏷 Label</label>
        <input type="text" id="f-label" placeholder="e.g. Day 01 Trading Goatfunded">
      </div>
    </div>

    <div class="checks">
      <div class="check-item">
        <input type="checkbox" id="f-pc">
        <label for="f-pc">Analyzed on PC (not phone)</label>
      </div>
    </div>

    <div class="field">
      <label>Notes</label>
      <textarea id="f-notes" placeholder="What did you do right or wrong..."></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary">Save Trade</button>
      <button type="button" class="btn-secondary" id="cancelForm">Cancel</button>
    </div>
  </form>

  <div class="ledger-title">Trades</div>
  <div id="ledger"></div>
</div>

<script>
const STORAGE_KEY = 'maegancyy-journal-entries';
let entries = [];
let activeFilter = 'All';

// show/hide "other" text inputs
document.getElementById('f-account').addEventListener('change', e => {
  document.getElementById('f-account-other').classList.toggle('show', e.target.value === 'Other');
});
document.getElementById('f-instrument').addEventListener('change', e => {
  document.getElementById('f-instrument-other').classList.toggle('show', e.target.value === 'Other');
});

// ---- Instrument presets shared by calculators ----
const INSTRUMENT_PRESETS = {
  'Gold':               { pipSize: 0.01, pipValue: 1 },
  'GBPUSD':              { pipSize: 0.0001, pipValue: 10 },
  'EURUSD':              { pipSize: 0.0001, pipValue: 10 },
  'NAS100 (Nasdaq)':     { pipSize: 1, pipValue: 1 },
  'US30':                { pipSize: 1, pipValue: 1 },
  'BTC':                 { pipSize: 1, pipValue: 1 },
  'ETH':                 { pipSize: 1, pipValue: 1 },
  'Other':               { pipSize: 1, pipValue: 1 }
};

function populateInstrumentSelects(){
  const names = Object.keys(INSTRUMENT_PRESETS);
  ['p-instrument','r-instrument'].forEach(id => {
    const sel = document.getElementById(id);
    sel.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
  });
}

// ---- Tool panel open/close + tabs ----
function openTools(defaultTab){
  const panel = document.getElementById('toolsPanel');
  panel.classList.add('open');
  switchTab(defaultTab);
  panel.scrollIntoView({behavior:'smooth', block:'start'});
}
function switchTab(tab){
  document.querySelectorAll('.tool-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('pipsTool').style.display = tab === 'pips' ? 'block' : 'none';
  document.getElementById('riskTool').style.display = tab === 'risk' ? 'block' : 'none';
}
document.getElementById('toggleTools').addEventListener('click', () => openTools('pips'));
document.getElementById('toggleTools2').addEventListener('click', () => openTools('risk'));
document.querySelectorAll('.tool-tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});

// ---- Pips calculator ----
document.getElementById('p-instrument').addEventListener('change', (e) => {
  document.getElementById('p-pipsize').value = INSTRUMENT_PRESETS[e.target.value].pipSize;
  calcPips();
});
['p-price1','p-price2','p-pipsize'].forEach(id => {
  document.getElementById(id).addEventListener('input', calcPips);
});
function calcPips(){
  const p1 = parseFloat(document.getElementById('p-price1').value) || 0;
  const p2 = parseFloat(document.getElementById('p-price2').value) || 0;
  const pipSize = parseFloat(document.getElementById('p-pipsize').value) || 0.0001;
  const dist = Math.abs(p1 - p2);
  const pips = pipSize ? dist / pipSize : 0;
  document.getElementById('p-distance').textContent = dist.toFixed(5).replace(/0+$/,'').replace(/\.$/,'') || '0';
  document.getElementById('p-pips').textContent = pips.toFixed(1);
}
document.getElementById('sendToRisk').addEventListener('click', () => {
  const pips = document.getElementById('p-pips').textContent;
  const instrument = document.getElementById('p-instrument').value;
  document.getElementById('r-slpips').value = pips;
  document.getElementById('r-instrument').value = instrument;
  document.getElementById('r-pipvalue').value = INSTRUMENT_PRESETS[instrument].pipValue;
  switchTab('risk');
  calcRisk();
});

// ---- Risk calculator ----
document.getElementById('r-instrument').addEventListener('change', (e) => {
  document.getElementById('r-pipvalue').value = INSTRUMENT_PRESETS[e.target.value].pipValue;
  calcRisk();
});
['r-balance','r-riskpct','r-slpips','r-pipvalue'].forEach(id => {
  document.getElementById(id).addEventListener('input', calcRisk);
});
document.querySelectorAll('.preset-chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('r-riskpct').value = btn.dataset.pct;
    calcRisk();
  });
});
function calcRisk(){
  const balance = parseFloat(document.getElementById('r-balance').value) || 0;
  const riskPct = parseFloat(document.getElementById('r-riskpct').value) || 0;
  const slPips = parseFloat(document.getElementById('r-slpips').value) || 0;
  const pipValue = parseFloat(document.getElementById('r-pipvalue').value) || 0;

  const riskAmt = balance * (riskPct / 100);
  const denom = slPips * pipValue;
  const lots = denom ? riskAmt / denom : 0;

  document.getElementById('r-riskamt').textContent = '$' + riskAmt.toFixed(2);
  document.getElementById('r-lots').textContent = lots.toFixed(2);
  document.getElementById('r-minilots').textContent = (lots * 10).toFixed(2);
  document.getElementById('r-microlots').textContent = (lots * 100).toFixed(2);
}

async function loadEntries(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
  }catch(e){
    entries = [];
  }
  render();
}

async function saveEntries(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }catch(e){
    console.error('Storage error', e);
  }
}

function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

function filteredEntries(){
  if(activeFilter === 'All') return entries;
  return entries.filter(e => e.instrument === activeFilter);
}

function computeStats(list){
  const total = list.length;
  const wins = list.filter(e => e.result === 'TP').length;
  const losses = list.filter(e => e.result === 'SL').length;
  const decided = wins + losses;
  const winRate = decided ? Math.round((wins/decided)*100) : 0;
  const totalPct = list.reduce((s,e) => s + (parseFloat(e.resultpct)||0), 0);
  const rulesKept = list.filter(e => e.rules === 'Not Break').length;
  const rulesPct = total ? Math.round((rulesKept/total)*100) : 0;
  const pcCount = list.filter(e => e.pc).length;
  const pcPct = total ? Math.round((pcCount/total)*100) : 0;
  return {total, winRate, totalPct, rulesPct, pcPct};
}

function renderStats(){
  const s = computeStats(filteredEntries());
  const bar = document.getElementById('statsBar');
  bar.innerHTML = `
    <div class="card"><div class="v">${s.total}</div><div class="l">Trades</div></div>
    <div class="card"><div class="v">${s.winRate}%</div><div class="l">Win Rate</div></div>
    <div class="card"><div class="v" style="color:${s.totalPct>=0?'#3c7a4c':'#b8433d'}">${s.totalPct>=0?'+':''}${s.totalPct.toFixed(1)}%</div><div class="l">Total Result</div></div>
    <div class="card"><div class="v">${s.rulesPct}%</div><div class="l">Rules Kept</div></div>
    <div class="card"><div class="v">${s.pcPct}%</div><div class="l">PC Analysis</div></div>
  `;
}

function renderCurve(){
  const list = [...filteredEntries()].sort((a,b) => a.date.localeCompare(b.date));
  const svg = document.getElementById('curveSvg');
  if(list.length === 0){
    svg.innerHTML = `<text x="10" y="40" fill="#b5b0a3" font-size="11" font-family="IBM Plex Mono">No trades yet</text>`;
    return;
  }
  let cum = 0;
  const points = [0];
  list.forEach(e => { cum += (parseFloat(e.resultpct)||0); points.push(cum); });
  const w = 880, h = 70, pad = 6;
  const maxV = Math.max(...points, 0.5);
  const minV = Math.min(...points, -0.5);
  const range = maxV - minV || 1;
  const stepX = (w - pad*2) / (points.length - 1);
  const coords = points.map((v,i) => {
    const x = pad + i*stepX;
    const y = h - pad - ((v - minV)/range)*(h - pad*2);
    return [x,y];
  });
  const zeroY = h - pad - ((0 - minV)/range)*(h - pad*2);
  const linePath = coords.map((c,i) => (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const lastColor = cum >= 0 ? '#3c7a4c' : '#b8433d';
  svg.innerHTML = `
    <line x1="0" y1="${zeroY}" x2="${w}" y2="${zeroY}" stroke="#e9e6e0" stroke-width="1" stroke-dasharray="2,3"/>
    <path d="${linePath}" fill="none" stroke="${lastColor}" stroke-width="2.2"/>
    <circle cx="${coords[coords.length-1][0]}" cy="${coords[coords.length-1][1]}" r="3.5" fill="${lastColor}"/>
  `;
}

function renderFilters(){
  const presets = ['All','Gold','GBPUSD','EURUSD','NAS100 (Nasdaq)','US30','BTC','ETH'];
  const used = [...new Set(entries.map(e => e.instrument))];
  const extra = used.filter(u => !presets.includes(u));
  const all = presets.concat(extra);
  const bar = document.getElementById('filterBar');
  bar.innerHTML = all.map(p =>
    `<button class="filter-chip ${p===activeFilter?'active':''}" data-i="${p}">${p}</button>`
  ).join('');
  bar.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.i;
      render();
    });
  });
}

function renderLedger(){
  const list = [...filteredEntries()].sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
  const container = document.getElementById('ledger');
  if(list.length === 0){
    container.innerHTML = `<div class="empty"><div class="big">No trades logged yet</div>Tap "+ New Trade" to add your first one.</div>`;
    return;
  }
  container.innerHTML = list.map(e => {
    const pct = parseFloat(e.resultpct)||0;
    const pctClass = e.result === 'BE' ? 'flat' : (pct >= 0 ? 'pos' : 'neg');
    const resultPillClass = e.result === 'TP' ? 'green' : e.result === 'SL' ? 'red' : 'gray';
    const warn = e.rules === 'Broke Rules' ? `<span class="flag-warn">Broke rules</span>` : '';
    return `
      <div class="trade">
        <div class="trade-top">
          <div>
            <div class="trade-instrument">${e.instrument}</div>
            <div class="trade-date">${fmtDate(e.date)} · ${e.account}${e.phase ? ' · '+e.phase : ''}</div>
          </div>
          <div class="trade-result">
            <div class="result-pct ${pctClass}">${pct>=0?'+':''}${pct.toFixed(1)}%</div>
          </div>
        </div>
        <div class="pills">
          <span class="pill green">${e.bias}</span>
          <span class="pill orange">${e.session}</span>
          ${e.model ? `<span class="pill blue">${e.model}</span>` : ''}
          ${e.htf ? `<span class="pill purple">${e.htf}</span>` : ''}
          <span class="pill ${resultPillClass}">${e.result}</span>
          <span class="pill yellow">Risk ${e.risk}%</span>
          <span class="pill peach">${e.rr}RR</span>
        </div>
        ${e.label ? `<div class="trade-notes"><strong>${e.label}</strong></div>` : ''}
        ${e.notes ? `<div class="trade-notes">"${e.notes}"</div>` : ''}
        <div class="trade-foot">
          <div class="flags">${warn}${!e.pc ? '<span class="flag-warn">No PC analysis</span>' : ''}</div>
          <button class="del-btn" data-id="${e.id}">delete</button>
        </div>
      </div>
    `;
  }).join('');
  container.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = parseInt(btn.dataset.id);
      entries = entries.filter(e => e.id !== id);
      await saveEntries();
      render();
    });
  });
}

function render(){
  renderStats();
  renderCurve();
  renderFilters();
  renderLedger();
}

document.getElementById('toggleForm').addEventListener('click', () => {
  const form = document.getElementById('entryForm');
  form.classList.add('open');
  document.getElementById('f-date').valueAsDate = new Date();
  form.scrollIntoView({behavior:'smooth', block:'start'});
});

document.getElementById('cancelForm').addEventListener('click', () => {
  document.getElementById('entryForm').classList.remove('open');
});

document.getElementById('entryForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const accountVal = document.getElementById('f-account').value;
  const accountOther = document.getElementById('f-account-other').value;
  const instrumentVal = document.getElementById('f-instrument').value;
  const instrumentOther = document.getElementById('f-instrument-other').value;

  const entry = {
    id: Date.now(),
    account: accountVal === 'Other' && accountOther ? accountOther : accountVal,
    phase: document.getElementById('f-phase').value,
    instrument: instrumentVal === 'Other' && instrumentOther ? instrumentOther : instrumentVal,
    bias: document.getElementById('f-bias').value,
    date: document.getElementById('f-date').value,
    htf: document.getElementById('f-htf').value,
    model: document.getElementById('f-model').value,
    rules: document.getElementById('f-rules').value,
    risk: document.getElementById('f-risk').value || 0,
    rr: document.getElementById('f-rr').value || 0,
    session: document.getElementById('f-session').value,
    result: document.getElementById('f-result').value,
    resultpct: document.getElementById('f-resultpct').value || 0,
    label: document.getElementById('f-label').value,
    pc: document.getElementById('f-pc').checked,
    notes: document.getElementById('f-notes').value
  };
  entries.push(entry);
  await saveEntries();
  ev.target.reset();
  ev.target.classList.remove('open');
  document.getElementById('f-account-other').classList.remove('show');
  document.getElementById('f-instrument-other').classList.remove('show');
  render();
});

populateInstrumentSelects();
calcPips();
calcRisk();
loadEntries();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
